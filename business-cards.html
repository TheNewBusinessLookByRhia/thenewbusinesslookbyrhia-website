<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Business Cards — Order</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;max-width:820px;margin:32px auto;padding:0 16px}label{display:block;margin:10px 0 6px;font-weight:600}input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}button{background:#C5A06A;color:#111;border:none;padding:12px 18px;border-radius:8px;font-weight:700;margin-top:14px;cursor:pointer}header a{color:inherit;text-decoration:none}</style>
</head>
<body>
  <header>
    <a href="/">← Back to home</a>
    <h1>Business Card Order</h1>
    <p>Fill the form below and click Submit. The request will be emailed to thenewbusinesslook@outlook.co.uk.</p>
  </header>

  <form action="https://formsubmit.co/thenewbusinesslook@outlook.co.uk" method="POST">
    <!-- Hidden fields for FormSubmit behavior -->
    <input type="hidden" name="_subject" value="New business card order">
    <input type="hidden" name="_next" value="/thank-you-business-cards.html">
    <input type="hidden" name="_captcha" value="false">

    <label for="name">Full name</label>
    <input id="name" name="name" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel">

    <label for="company">Company (optional)</label>
    <input id="company" name="company" type="text">

    <label for="quantity">Quantity</label>
    <select id="quantity" name="quantity" required>
      <option value="50">50</option>
      <option value="100" selected>100</option>
      <option value="250">250</option>
      <option value="500">500</option>
    </select>

    <label for="package">Package</label>
    <select id="package" name="package">
      <option value="standard">Standard</option>
      <option value="premium">Premium</option>
      <option value="package-2">Package 2</option>
      <option value="package-3">Package 3</option>
    </select>

    <label for="details">Design / Additional details</label>
    <textarea id="details" name="details" rows="6" placeholder="Tell us about text, logo, finish, deadline, etc."></textarea>

    <button type="submit">Submit order request</button>
  </form>

  <p style="margin-top:18px;font-size:0.9em;color:#555">By submitting you agree we'll contact you about your order.</p>
</body>
</html>
